name: Draw ZMK keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "config/*.json"
      - ".github/workflows/draw-keymaps.yml"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install keymap-drawer
        run: python -m pip install keymap-drawer==0.18.1

      - name: Generate keymap drawer files
        run: |
          mkdir -p keymap-drawer
          keymap parse -z config/Keiler.keymap -c 10 -o /tmp/Keiler.yaml
          {
            echo "layout: {qmk_info_json: config/Keiler.json, qmk_layout: LAYOUT}"
            cat /tmp/Keiler.yaml
          } > keymap-drawer/Keiler.yaml
          keymap draw keymap-drawer/Keiler.yaml -o keymap-drawer/Keiler.svg

      - name: Commit generated keymap drawer files
        run: |
          if git diff --quiet -- keymap-drawer/Keiler.yaml keymap-drawer/Keiler.svg; then
            echo "No keymap drawer changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap-drawer/Keiler.yaml keymap-drawer/Keiler.svg
          git commit -m "chore: update keymap drawer"
          git push
