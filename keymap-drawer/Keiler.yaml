layers:
  default:
  - [Q, W, F, P, B, J, L, U, Y, ;]
  - - {t: A, h: LGUI}
    - {t: R, h: LALT}
    - {t: S, h: LCTRL}
    - {t: T, h: LSHFT}
    - G
    - M
    - {t: N, h: RSHFT}
    - {t: E, h: RCTRL}
    - {t: I, h: LALT}
    - {t: O, h: RGUI}
  - [Z, X, C, D, V, K, H, ',', ., /]
  - - ESC
    - TAB
    - {t: SPACE, h: sym}
    - {t: RET, h: num}
    - BSPC
    - DEL
  sym:
  - ['', '', '', '`', '*', ^, (, ), '!', '~']
  - ['', RALT, '', '"', +, $, '{', '}', '&', '|']
  - ['', '', '', '''', '', '=', '[', ']', '%', \]
  - - ''
    - ''
    - {type: held}
    - {t: '-', h: _}
    - '#'
    - '@'
  num:
  - - ''
    - {t: '7', h: F7}
    - {t: '8', h: F8}
    - {t: '9', h: F9}
    - HOME
    - PG UP
    - ''
    - ''
    - ''
    - ''
  - - F12
    - {t: '4', h: F4}
    - {t: '5', h: F5}
    - {t: '6', h: F6}
    - END
    - PG DN
    - {t: LEFT, h: H}
    - {t: UP, h: K}
    - {t: RIGHT, h: L}
    - ''
  - - F11
    - {t: '1', h: F1}
    - {t: '2', h: F2}
    - {t: '3', h: F3}
    - {t: '0', h: F10}
    - ''
    - ''
    - {t: DOWN, h: J}
    - ''
    - ''
  - - ''
    - LSHFT
    - '&cs'
    - {type: held}
    - ''
    - '&studio_unlock'
combos:
- p: [14, 15]
  k: '&caps_word'
  l: [default]
