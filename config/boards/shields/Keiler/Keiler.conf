# Battery reporting (unsure if this needs to be applied to all boards)
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Using experimental BT improvements, because why not
# https://zmk.dev/blog/2024/02/09/zephyr-3-5#ble-stability-improvements
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_STUDIO=y

# Keep Bluetooth bonds and selected profiles in persistent flash storage.
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
# CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START is not set
# CONFIG_ZMK_SETTINGS_RESET_ON_START is not set

# Persist Bluetooth bond/profile changes quickly so they survive a physical power switch.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=5000

# Enable deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Enable smooth scrolling
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Boost Bluetooth transmit power to +8 dBm for maximum connection stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
